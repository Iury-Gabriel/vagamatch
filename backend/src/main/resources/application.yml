spring:
  application:
    name: vagamatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vagamatch}
    username: ${DB_USER:vagamatch}
    password: ${DB_PASSWORD:vagamatch}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# Configuração da aplicação (adapters de IA e segurança)
vagamatch:
  security:
    jwt:
      # Chave HS256 em Base64. Em produção, injetar via variável de ambiente.
      secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzIrYnl0ZXM=}
      expiration-minutes: ${JWT_EXP_MINUTES:120}
  ai:
    provider: ${AI_PROVIDER:mock}   # mock (padrão, sem custo) | openai
    api-key: ${OPENAI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: 1536
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    dev.iurygabriel.vagamatch: INFO
